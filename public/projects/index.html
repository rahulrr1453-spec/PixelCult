function populateMonthYearSelectors() {
    const monthSelect = document.getElementById('month-select');
    const yearSelect = document.getElementById('year-select');

    const months = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    monthSelect.innerHTML = '';
    months.forEach((month, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.text = month;
        monthSelect.appendChild(option);
    });

    yearSelect.innerHTML = '';
    for (let y = 1970; y <= 2100; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.text = y;
        yearSelect.appendChild(option);
    }

    monthSelect.value = currentMonth;
    yearSelect.value = currentYear;

    monthSelect.onchange = () => {
        currentMonth = parseInt(monthSelect.value);
        generateCalendar(currentMonth, currentYear);
    };

    yearSelect.onchange = () => {
        currentYear = parseInt(yearSelect.value);
        generateCalendar(currentMonth, currentYear);
    };
}

function generateCalendar(month, year) {
    const today = new Date();
    const isCurrentMonth = month === today.getMonth() && year === today.getFullYear();

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let calendar = '<table>';
    calendar += '<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr><tr>';

    for (let i = 0; i < firstDay; i++) {
        calendar += '<td></td>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const isToday = isCurrentMonth && d === today.getDate();
        calendar += `<td class="${isToday ? 'today' : ''}">${d}</td>`;
        if ((firstDay + d) % 7 === 0) calendar += '</tr><tr>';
    }

    calendar += '</tr></table>';
    document.getElementById('popup-calendar').innerHTML = calendar;
}

        function stopWebcam() {
            const webcam = document.getElementById('webcam');
            const stream = webcam.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop()); // Stop all media tracks
                webcam.srcObject = null; // Reset the webcam stream
            }
            const response = "Webcam has been stopped, and vision has been deactivated.";
            displayMarthaResponse(response);
            speak(response);
            
            // Hide the webcam and remove the border by adding the 'hidden' class
            webcam.classList.add('hidden');
        }

        function detectObjectsFromWebcam() {
            const webcamCanvas = document.getElementById('webcam-canvas');
            const webcam = document.getElementById('webcam');
            const context = webcamCanvas.getContext('2d');
            setInterval(() => {
                context.drawImage(webcam, 0, 0, webcamCanvas.width, webcamCanvas.height);
                model.detect(webcamCanvas).then((predictions) => {
                    detectedObjects = predictions.map(p => p.class);
                    if (detectedObjects.length > 0) {
                        console.log("Detected objects: ", detectedObjects);
                    }
                });
            }, 100);
        }
        function describeVision() {
            if (detectedObjects.length > 0) {
                const objectsList = detectedObjects.join(', ');
                const response = `I can see the following: ${objectsList}.`;
                displayMarthaResponse(response);
                speak(response);
            } else {
                const response = "I'm not detecting any objects right now.";
                displayMarthaResponse(response);
                speak(response);
            }
        }

    
        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((stream) => {
                    const webcam = document.getElementById('webcam');
                    webcam.style.display = 'block';
                    webcam.srcObject = stream;
                    detectObjectsFromWebcam();
                })
                .catch((err) => {
                    console.error("Error accessing webcam: ", err);
                    const response = "Hmm, sorry, I couldn’t access the webcam.";
                    displayMarthaResponse(response);
                    speak(response);
                });
        }

function evaluateMath(command) {
    try {
        let expression = command.toLowerCase();

        // Replace natural language with math symbols
        expression = expression
            .replace(/calculate|solve|evaluate/g, "")
            .replace(/plus/g, "+")
            .replace(/minus/g, "-")
            .replace(/times|into/g, "*")
            .replace(/divided by/g, "/")
            .replace(/over/g, "/")
            .replace(/modulus|mod|remainder/g, "%")
            .replace(/[^0-9+\-*/().%^ ]/g, "") // remove anything that's not a number/operator

        expression = expression.trim();

        if (expression === "") {
            speak("I couldn't find a math expression to calculate.");
            return;
        }

        // Evaluate safely
        const result = Function(`"use strict"; return (${expression})`)();
        const response = `The answer is ${result}`;
        displayMarthaResponse(response);
        speak(response);
    } catch (err) {
        console.error("Math evaluation error:", err);
        speak("Sorry, I couldn't calculate that.");
    }
}


function solvePercentage(command) {
    const match = command.match(/(\d+)\s*% of (\d+)/i);
    if (match) {
        const percent = parseFloat(match[1]);
        const base = parseFloat(match[2]);
        const result = (percent / 100) * base;
        const response = `${percent}% of ${base} is ${result}`;
        displayMarthaResponse(response);
        speak(response);
    } else {
        speak("Please say something like 'What is 20 percent of 300'");
    }
}

function convertUnits(command) {
    const match = command.match(/convert (\d+(\.\d+)?) (\w+) to (\w+)/i);
    if (!match) {
        speak("Please say something like 'Convert 5 kilometers to miles'");
        return;
    }

    const value = parseFloat(match[1]);
    const from = match[3].toLowerCase();
    const to = match[4].toLowerCase();

    const conversions = {
        kilometers: { miles: 0.621371 },
        miles: { kilometers: 1.60934 },
        celsius: { fahrenheit: (c) => (c * 9/5 + 32) },
        fahrenheit: { celsius: (f) => ((f - 32) * 5/9) },
        kg: { pounds: 2.20462 },
        pounds: { kg: 0.453592 }
    };

    const factor = conversions[from]?.[to];

    let result = null;
    if (typeof factor === "function") {
        result = factor(value).toFixed(2);
    } else if (typeof factor === "number") {
        result = (value * factor).toFixed(2);
    }

    if (result !== null) {
        const response = `${value} ${from} is ${result} ${to}`;
        displayMarthaResponse(response);
        speak(response);
    } else {
        speak(`Sorry, I can't convert from ${from} to ${to} yet.`);
    }
}

function calculateArea(command) {
    const circleMatch = command.match(/area of circle with radius (\d+)/i);
    const squareMatch = command.match(/area of square with side (\d+)/i);
    const triangleMatch = command.match(/area of triangle with base (\d+) and height (\d+)/i);

    if (circleMatch) {
        const radius = parseFloat(circleMatch[1]);
        const area = (Math.PI * radius * radius).toFixed(2);
        speak(`The area of the circle is ${area}`);
        displayMarthaResponse(`Area of circle with radius ${radius} is ${area}`);
    } else if (squareMatch) {
        const side = parseFloat(squareMatch[1]);
        const area = side * side;
        speak(`The area of the square is ${area}`);
        displayMarthaResponse(`Area of square with side ${side} is ${area}`);
    } else if (triangleMatch) {
        const base = parseFloat(triangleMatch[1]);
        const height = parseFloat(triangleMatch[2]);
        const area = (0.5 * base * height).toFixed(2);
        speak(`The area of the triangle is ${area}`);
        displayMarthaResponse(`Area of triangle with base ${base} and height ${height} is ${area}`);
    } else {
        speak("Please say something like 'area of circle with radius 5'");
    }
}


function searchBooks(query) {
    const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.docs && data.docs.length > 0) {
                const book = data.docs[0];
                const title = book.title;
                const author = book.author_name ? book.author_name.join(', ') : 'Unknown author';
                const year = book.first_publish_year || 'unknown year';

                const response = `I found this book: "${title}" by ${author}, first published in ${year}.`;
                displayMarthaResponse(response);
                speak(response);
            } else {
                const response = "Hmm, I couldn't find any books for that topic.";
                displayMarthaResponse(response);
                speak(response);
            }
        })
        .catch(error => {
            console.error("OpenLibrary error:", error);
            speak("Oops, I couldn't fetch book details right now.");
        });
}

        function searchWikipedia(query) {
            const url = `${WIKIPEDIA_API_URL}${encodeURIComponent(query)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.extract) {
                        const response = data.extract;
                        displayMarthaResponse(response);
                        speak(response);
                    } else {
                        const response = "Hmm, sorry, I couldn’t find an answer for that.";
                        displayMarthaResponse(response);
                        speak(response);
                    }
                })
                .catch(error => {
                    console.error('Wikipedia search error:', error);
                    const response = "Sorry, there was an error while fetching from Wikipedia.";
                    displayMarthaResponse(response);
                    speak(response);
                });
        }
    
        // Event listener for text input
       commandInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        const command = event.target.value.toLowerCase().trim();
        if (command) {
            displayUserText(command);

            // Temporarily disable speak()
            const originalSpeak = speak;
            speak = function() {}; // Disable speaking
            processCommand(command);
            speak = originalSpeak; // Restore speaking

            event.target.value = '';
        }
    }
});


    
        // Speak when the button is clicked
       document.getElementById('speak-btn').addEventListener('click', function () {
    if (!isListening) {
        startListening();
        isListening = true;
    } else {
        recognition.stop();
        isListening = false;
        const response = "Okay, I've stopped listening.";
        displayMarthaResponse(response);
        speak(response);
    }
});

document.getElementById('text-btn').addEventListener('click', function () {
    if (!isTextMode) {
        const response = "Text mode is now active. You can type commands below.";
        displayMarthaResponse(response);
        speak(response);
        commandInput.style.display = "block";
        commandInput.focus();
        isTextMode = true;
        isTypingMode = true;  // ❌ Disable speaking during typing
    } else {
        const response = "Okay, turned off text mode now.. The input box has been removed.";
        displayMarthaResponse(response);
        // Do NOT call speak() here — just show response silently
        commandInput.style.display = "none";
        isTextMode = false;
        isTypingMode = false;  // ✅ Re-enable speaking for future
    }
});

  const visionBtn = document.getElementById('vision-btn');

  visionBtn.addEventListener('mouseover', () => {
      visionBtn.style.backgroundColor = '#0099cc';
      visionBtn.style.transform = 'scale(1.1)';
      visionBtn.style.boxShadow = '0 0 20px 4px rgba(0,255,255,0.8)';
  });

  visionBtn.addEventListener('mouseout', () => {
      visionBtn.style.backgroundColor = '#398181';
      visionBtn.style.transform = 'scale(1)';
      visionBtn.style.boxShadow = '0 0 10px 2px rgba(0,255,255,0.5)';
  });

  visionBtn.addEventListener('click', () => {
      const response = "Ohh, activating vision using your webcam.";
      document.querySelector("footer").style.display = "none";
      displayMarthaResponse(response);
      speak(response);
      startWebcam();
  });
</script>
